<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Person · settlement index</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../shared/site.css">
</head>

<body>
  <script src="../nav.js" defer></script>

  <div class="wrap">
    <pre id="person-pre">
Lade…
    </pre>
  </div>

  <script type="module">
    function qs(name) {
      return new URLSearchParams(location.search).get(name);
    }
    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadPerson(slug) {
      const url = `../content/people/${encodeURIComponent(slug)}.json?v=${Date.now()}`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`Failed to load ${url}: ${r.status}`);
      return r.json();
    }

    (async function main() {
      const el = document.getElementById("person-pre");
      try {
        const slug = qs("slug");
        if (!slug) throw new Error("Missing ?slug=...");
        const p = await loadPerson(slug);

        const name = escapeHtml(p.name || slug);
        const role = escapeHtml(p.role || "");
        const years =
          (p.birthYear || p.deathYear)
            ? `${p.birthYear ?? "?"}–${p.deathYear ?? ""}`.trim()
            : "";

        const summary = escapeHtml(p.summary || "");
        const links = Array.isArray(p.links) ? p.links : [];
        const sources = Array.isArray(p.sources) ? p.sources : [];

        const out = [];
        out.push(`${name}`);
        if (years) out.push(`${years}`);
        if (role) out.push(`${role}`);
        out.push("");
        if (summary) out.push(summary);
        out.push("");

        if (links.length) {
          out.push("links");
          for (const l of links) {
            if (!l?.url) continue;
            const label = escapeHtml(l.label || l.type || "link");
            const url = escapeHtml(l.url);
            out.push(`- ${label}: ${url}`);
          }
          out.push("");
        }

        if (sources.length) {
          out.push("quellen");
          for (const s of sources) {
            if (!s?.url) continue;
            const label = escapeHtml(s.label || s.type || "source");
            const url = escapeHtml(s.url);
            const acc = s.accessedAt ? ` (accessed: ${escapeHtml(s.accessedAt)})` : "";
            out.push(`- ${label}: ${url}${acc}`);
          }
          out.push("");
        }

        out.push(`<a href="./index.html">← zurück</a>`);
        el.innerHTML = out.join("\n");
        document.title = `${p.name || "Person"} · settlement index`;
      } catch (e) {
        el.textContent = `Fehler:\n${e?.message || e}`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
